<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Predictor</title>
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #1e3a8a, #1d4ed8);
        min-height: 100vh;
        padding: 30px 20px;
    }

    .container {
        max-width: 600px;
        margin: 0 auto;
    }

    .header {
        text-align: center;
        color: white;
        margin-bottom: 30px;
    }

    .header h1 {
        font-size: 2rem;
        margin-bottom: 8px;
    }

    .card {
        background: white;
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        font-weight: 600;
        color: #1e3a8a;
        margin-bottom: 6px;
    }

    input[type="number"], select {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e5e7eb;
        border-radius: 8px;
        font-size: 1rem;
        outline: none;
    }

    input[type="number"]:focus, select:focus {
        border-color: #1d4ed8;
    }

    button {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #1e3a8a, #1d4ed8);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        margin-top: 10px;
    }

    button:hover {
        opacity: 0.9;
    }

    .result {
        margin-top: 28px;
        padding: 24px;
        border-radius: 12px;
        background: #f0f9ff;
        border: 2px solid #bae6fd;
    }

    .result h2 {
        margin-bottom: 16px;
        color: #1e3a8a;
    }

    .placed-banner {
        font-size: 1.5rem;
        font-weight: 800;
        padding: 16px;
        border-radius: 10px;
        margin-bottom: 16px;
        text-align: center;
        background: #dcfce7;
        color: #166534;
    }

    .result p {
        margin-bottom: 8px;
        font-size: 1rem;
        color: #374151;
    }
</style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 Placement Predictor</h1>
            <!-- <p>Vidyavardhini's College of Engineering & Technology</p> -->
        </div>

        <div class="card">
            <form method="POST" action="/predict">

                <div class="form-group">
                    <label>📊 CGPA</label>
                    <input type="number" name="cgpa" step="0.01"
                           min="5" max="10" placeholder="e.g. 8.5" required>
                </div>

                <div class="form-group">
                    <label>🧠 Aptitude Score</label>
                    <input type="number" name="aptitude_score"
                           min="0" max="100" placeholder="e.g. 75" required>
                </div>

                <div class="form-group">
                    <label>🗣️ Communication Score</label>
                    <input type="number" name="communication_score"
                           min="0" max="100" placeholder="e.g. 70" required>
                </div>

                <div class="form-group">
                    <label>💻 Projects Done</label>
                    <input type="number" name="projects_done"
                           min="0" max="10" placeholder="e.g. 3" required>
                </div>

                <div class="form-group">
                    <label>🏢 Internship Done?</label>
                    <select name="internship">
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>

                <button type="submit">🔮 Predict My Placement</button>

            </form>

            {% if result %}
            <div class="result">
                <h2>📋 Your Result</h2>
                <div class="placed-banner">{{ result.placed }}</div>
                <p>Placement Chance: <strong>{{ result.placement_chance }}%</strong></p>
                <p>Expected Salary: <strong>₹{{ result.salary }} LPA</strong></p>
                <p>CGPA: <strong>{{ result.cgpa }}</strong></p>
                <p>Internship: <strong>{{ result.internship }}</strong></p>
            </div>
            {% endif %}

        </div>
    </div>
</body>
</html>
